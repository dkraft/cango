<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CANGO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>CANGO</h1>
    <button id="help" type="button" aria-label="Help">?</button>
  </div>
  <p id="status" class="status">connecting</p>
</header>
<nav id="tabs" class="tabs" aria-label="Views"></nav>
<div class="layout">
  <section class="stream" aria-label="Live frames">
    <div class="tools">
      <button id="funnel" type="button" aria-label="Filter">▾</button>
      <button id="notch" type="button" aria-label="Notch">⌐</button>
      <button id="hold" type="button" aria-label="Hold">○</button>
    </div>
    <table id="sniff">
      <tbody id="rows"></tbody>
    </table>
  </section>
  <aside>
    <section>
      <h2>Project</h2>
      <label>Applied
        <select id="project"></select>
      </label>
      <div class="row">
        <button id="apply-project" type="button">Apply</button>
        <button id="delete-project" type="button">Delete</button>
      </div>
      <label>New id <input id="new-id" spellcheck="false"></label>
      <label>Name <input id="new-name"></label>
      <label>Bitrate <input id="new-bitrate" type="number" value="500000"></label>
      <label>TX allow <input id="new-allow" spellcheck="false"></label>
      <button id="save-project" type="button">Save project</button>
    </section>
    <section>
      <h2>Files</h2>
      <div class="row">
        <button id="file-up" type="button" aria-label="Up">↑</button>
        <span id="file-path"></span>
        <button id="file-refresh" type="button" aria-label="Refresh">↻</button>
      </div>
      <ul id="file-list"></ul>
      <button id="file-more" type="button" hidden>↓</button>
    </section>
    <section>
      <h2>Inject</h2>
      <label class="check"><input id="confirm-arm" type="checkbox"> I intend to transmit on this bus</label>
      <div class="row">
        <button id="arm" type="button" disabled>Arm</button>
        <button id="disarm" type="button" disabled>Disarm</button>
      </div>
      <label>ID <input id="send-id" value="123" spellcheck="false"></label>
      <label>Data hex <input id="send-data" value="" spellcheck="false"></label>
      <button id="send-frame" type="button" disabled>Send frame</button>
    </section>
    <section>
      <h2>WiFi</h2>
      <label>Slot 0 SSID <input id="wifi0-ssid" spellcheck="false"></label>
      <label>Slot 0 password <input id="wifi0-pass" spellcheck="false"></label>
      <label>Slot 1 SSID <input id="wifi1-ssid" spellcheck="false"></label>
      <label>Slot 1 password <input id="wifi1-pass" spellcheck="false"></label>
      <button id="save-wifi" type="button">Save WiFi</button>
    </section>
    <section id="modules">
      <h2>Modules</h2>
      <button id="find-modules" type="button" disabled>Find modules</button>
    </section>
    <p id="op-note" class="note"></p>
  </aside>
</div>
<button id="add-vehicle" type="button">+</button>
<dialog id="vehicle-picker">
  <p>Vehicle</p>
  <button id="pick-zero-xb" type="button">Zero XB</button>
  <button id="close-vehicle" type="button">Close</button>
</dialog>
<dialog id="funnel-sheet">
  <div class="row">
    <button id="filter-all" type="button">All</button>
    <button id="filter-none" type="button">None</button>
  </div>
  <div class="row">
    <input id="filter-id" spellcheck="false" inputmode="text">
    <input id="filter-to" spellcheck="false" inputmode="text">
    <button id="filter-add" type="button">+</button>
  </div>
  <div id="filter-chips"></div>
  <button id="funnel-close" type="button">Close</button>
</dialog>
<dialog id="help-sheet">
  <p>Row — one id, newest bytes</p>
  <p>Check — hide that id here</p>
  <p>Notch — freeze moving bits</p>
  <p>Hold — keep quiet ids</p>
  <p>Files — open a folder or drop a row</p>
  <button id="help-close" type="button">Close</button>
</dialog>
<dialog id="file-sheet">
  <p id="file-delete-name"></p>
  <button id="file-delete" type="button">Delete</button>
  <button id="file-delete-close" type="button">Close</button>
</dialog>
<script src="app.js"></script>
</body>
</html>
